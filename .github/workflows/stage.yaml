name: Build & Test & Deploy to Development
on:
  push:
    branches: [ staging ]
jobs:
  
  build:
    
    name: Build docker image & Deploy to k8s cluster
    runs-on: ubuntu-latest
   
    steps:

    - name: Check out code
      uses: actions/checkout@v2
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: mogul-mvp-be-payment-stage
        IMAGE_TAG: ${{github.sha}}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
    
    - name: Install kubectl
      uses: azure/setup-kubectl@v1
      with:
        version: 'v1.21.3'
      id: install
    
    - name: Update kube config
      run: aws eks update-kubeconfig --name Mogul-K8s	 --region us-east-1

    - name: Deploy image to Amazon EKS cluster
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: mogul-mvp-be-payment-stage
        IMAGE_TAG: ${{github.sha}}
      run: |
        kubectl set image deployment.apps/mogul-mvp-be-payment-deployment  \
        mogul-mvp-be-payment=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
        -n mogul-stage
